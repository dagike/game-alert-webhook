# Copy this file to config.yaml to change the defaults.
timezone: America/Toronto
run_times: ["09:00", "13:05"]   # two checks per day, 24-hour clock
country: CA
currency: CAD
post_when_empty: false           # true = also post "no new deals" when nothing is new. Problems always post.
report_when_ok: true             # show the "Run status" embed even when all sources are OK
wishlist_tolerance_percent: 0    # 5 means: alert when within 5% of the all-time low
wishlist_file: wishlist.yaml
database_path: data/state.db
sources:
  free_games: true
  ps_plus: true
  fanatical: true
  humble: true
  humble_choice: true
  wishlist: true
